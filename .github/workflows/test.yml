name: Lua tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: find AdaptiveNoise.lrplugin tests -name '*.lua' -exec luac5.1 -p {} \;
      - run: lua5.1 tests/run.lua
      - run: lua5.1 tests/sdk_contract.lua
      - run: lua5.1 tests/main_workflow.lua
